<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img">
  <title>EarlyWeb</title>
  <!-- EarlyWeb app icon: an original glossy orb with a four-pane window and an orbit swoosh. -->
  <defs>
    <radialGradient id="orb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#9ff3ff"/>
      <stop offset="0.45" stop-color="#1fa8e0"/>
      <stop offset="1" stop-color="#0b3f8c"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d8f6ff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dff8a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dff8a"/>
      <stop offset="1" stop-color="#e9ff6b"/>
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="440" fill="url(#orb)"/>
  <circle cx="512" cy="512" r="440" fill="none" stroke="#0a2f66" stroke-opacity="0.5" stroke-width="12"/>
  <g transform="translate(512 520) rotate(-8)">
    <rect x="-200" y="-200" width="190" height="190" rx="28" fill="url(#pane)"/>
    <rect x="10" y="-200" width="190" height="190" rx="28" fill="url(#pane)"/>
    <rect x="-200" y="10" width="190" height="190" rx="28" fill="url(#pane)"/>
    <rect x="10" y="10" width="190" height="190" rx="28" fill="url(#pane)"/>
  </g>
  <path d="M120 640 C 300 820, 760 820, 930 520" fill="none" stroke="url(#swoosh)" stroke-width="56" stroke-linecap="round"/>
  <ellipse cx="470" cy="270" rx="330" ry="170" fill="url(#gloss)"/>
</svg>
